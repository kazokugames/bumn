name: Uji dan bangun image

# Setiap push ke main: jalankan pemeriksaan, lalu bangun image Docker dan kirim ke GitHub Container Registry (GHCR).
# Server tinggal mengambil image "ghcr.io/<pemilik>/bumn-tes:latest" (tidak perlu membangun di server).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validasi bank soal, generator, config, dan sinkron web/data
        run: node check.js
      - name: Lint dan uji sanitasi
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run uji:sanitasi

  image:
    needs: uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nama image (huruf kecil)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bumn-tes" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
